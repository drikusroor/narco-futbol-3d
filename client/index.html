<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#120a08" />
    <title>Narco Futbol</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>⚽</text></svg>" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="grain" aria-hidden="true"></div>

    <!-- Heads up display -->
    <div id="hud" class="hidden">
      <div id="scoreboard">
        <div class="team home">
          <span class="badge" id="home-badge">MED</span>
          <span class="score" id="home-score">0</span>
        </div>
        <div class="clock">
          <span id="clock">5:00</span>
          <span id="phase-label"></span>
        </div>
        <div class="team away">
          <span class="score" id="away-score">0</span>
          <span class="badge" id="away-badge">CAL</span>
        </div>
      </div>

      <div id="toasts"></div>

      <div id="bottom-left">
        <div id="powerup" class="hidden"><span id="powerup-label"></span><i id="powerup-bar"></i></div>
        <div id="meters">
          <div class="meter stamina"><i id="stamina-bar"></i><label data-i18n="hud.stamina">AIR</label></div>
          <div class="meter charge"><i id="charge-bar"></i><label data-i18n="hud.charge">POWER</label></div>
        </div>
        <div id="you"><img id="you-avatar" class="avatar tiny" alt="" /><span id="you-text">—</span></div>
      </div>

      <canvas id="radar" width="220" height="150"></canvas>

      <div id="feed"></div>

      <!-- Drill panel: only visible in training -->
      <div id="drill" class="hidden">
        <h4 id="drill-title"></h4>
        <p id="drill-prompt"></p>
        <div id="drill-stats"></div>
      </div>

      <!-- Tutorial coach -->
      <div id="tutorial" class="hidden">
        <div class="step" id="tutorial-step"></div>
        <div class="task" id="tutorial-task"></div>
        <div class="tip" id="tutorial-tip"></div>
        <button id="tutorial-skip" data-i18n="tutorial.skip">Skip</button>
      </div>

      <div id="chatbox">
        <div id="chatlog"></div>
        <input id="chatinput" maxlength="140" />
      </div>

      <div id="netstat"><span id="ping">--</span> ms</div>

      <div id="help" class="hidden">
        <h3 data-i18n="settings.controls">Controls</h3>
        <div id="help-list"></div>
        <p class="small" data-i18n="hud.help.hint"></p>
      </div>
    </div>

    <!-- Front end -->
    <div id="menu">
      <div class="plate" id="menu-main">
        <h1><span>NARCO</span><em>FUTBOL</em></h1>
        <p class="tagline" data-i18n="menu.tagline"></p>

        <label class="field">
          <span data-i18n="menu.name">Your name</span>
          <div class="name-row">
            <input id="name-input" maxlength="18" data-i18n-ph="menu.name.ph" />
            <img id="name-avatar" class="avatar" alt="" />
          </div>
        </label>

        <label class="field">
          <span data-i18n="menu.mode">Mode</span>
          <select id="mode-select">
            <option value="online" data-i18n="menu.mode.online">Online</option>
            <option value="solo" data-i18n="menu.mode.solo">Solo (this device)</option>
            <option value="coop" data-i18n="menu.mode.coop">Local 2P (this device)</option>
          </select>
        </label>
        <p class="small hidden" id="online-disabled-note" data-i18n="menu.mode.onlineDisabled"></p>
        <p class="small hidden" id="local-note" data-i18n="menu.mode.localNote"></p>

        <label class="field" id="room-field">
          <span data-i18n="menu.room">Ground</span>
          <input id="room-input" maxlength="24" data-i18n-ph="menu.room.ph" />
        </label>

        <div class="field row">
          <label id="team-field"><span data-i18n="menu.team">Team</span>
            <select id="team-select">
              <option value="auto" data-i18n="menu.team.auto">Auto</option>
              <option value="0">Cartel de Medallo</option>
              <option value="1">Los Verdes de Cali</option>
            </select>
          </label>
          <label><span data-i18n="menu.length">Length</span>
            <select id="length-select">
              <option value="180">3 min</option>
              <option value="300" selected>5 min</option>
              <option value="480">8 min</option>
              <option value="600">10 min</option>
            </select>
          </label>
        </div>

        <div class="field row">
          <label><span data-i18n="menu.size">Squads</span>
            <select id="size-select">
              <option value="3">3 v 3</option>
              <option value="4">4 v 4</option>
              <option value="5" selected>5 v 5</option>
              <option value="6">6 v 6</option>
            </select>
          </label>
          <label><span data-i18n="menu.bots">Bots</span>
            <select id="difficulty-select">
              <option value="0.35" data-i18n="menu.bots.easy">Sunday league</option>
              <option value="0.68" selected data-i18n="menu.bots.normal">Normal</option>
              <option value="0.9" data-i18n="menu.bots.hard">Sicarios</option>
            </select>
          </label>
        </div>

        <button id="play-button" class="primary" data-i18n="menu.play">PLAY</button>
        <div class="button-row">
          <button id="training-button" class="ghost" data-i18n="menu.training">TRAINING</button>
          <button id="tutorial-button" class="ghost" data-i18n="menu.tutorial">TUTORIAL</button>
          <button id="settings-button" class="ghost" data-i18n="menu.settings">SETTINGS</button>
        </div>
        <p class="note" id="menu-note" data-i18n="menu.note"></p>
        <p class="small credits" data-i18n="menu.credits"></p>
      </div>

      <!-- Drill picker -->
      <div class="plate hidden" id="menu-training">
        <h1><span data-i18n="training.title">TRAINING</span></h1>
        <p class="tagline" data-i18n="training.pick"></p>
        <div id="drill-list"></div>
        <button id="training-back" class="ghost wide" data-i18n="training.back">BACK</button>
      </div>
    </div>

    <!-- Settings, over everything -->
    <div id="settings" class="hidden">
      <div class="plate">
        <h2 data-i18n="settings.title">SETTINGS</h2>

        <h3 data-i18n="settings.language">Language</h3>
        <div id="lang-row" class="chip-row"></div>

        <h3 data-i18n="settings.art">Player art</h3>
        <div id="art-row" class="chip-row"></div>
        <p class="small" data-i18n="settings.art.blurb"></p>

        <h3 data-i18n="settings.audio">Sound</h3>
        <label class="slider-row">
          <span data-i18n="settings.volume">Volume</span>
          <input id="volume-input" type="range" min="0" max="100" step="1" value="80" />
          <b id="volume-value">80</b>
        </label>

        <h3 data-i18n="settings.controls">Controls</h3>
        <p class="small" data-i18n="settings.rebind"></p>
        <div id="bind-table"></div>
        <p class="small" id="pad-status"></p>

        <div class="button-row">
          <button id="settings-reset" class="ghost" data-i18n="settings.reset">RESTORE DEFAULTS</button>
          <button id="settings-leave" class="ghost hidden" data-i18n="settings.leave">LEAVE</button>
          <button id="settings-close" class="primary" data-i18n="settings.close">CLOSE</button>
        </div>
      </div>
    </div>

    <div id="loading" class="hidden"><span data-i18n="loading.connecting">CONNECTING…</span></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
